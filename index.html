<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasımpatı Terminali</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080909;color:#b4eac5;min-height:100svh;display:grid;place-items:center;padding:14px;font:14px ui-monospace,Consolas,monospace}
main{width:min(100%,610px);border:1px solid #304538;background:#0b0e0c}
header,footer{padding:12px 16px;border-bottom:1px solid #304538;display:flex;justify-content:space-between;align-items:center;gap:8px}
footer{border-bottom:0;border-top:1px solid #304538}
pre{margin:0;display:grid;place-items:center;padding:18px 0;font:clamp(7px,3.05cqi,17px)/.83 ui-monospace,Consolas,monospace}
main{container-type:inline-size}
button{font:inherit;color:inherit;border:1px solid #547660;background:transparent;padding:7px 10px;cursor:pointer}
button:hover,button:focus-visible{background:#203a29}
header span:last-child,footer span{color:#92aa9a}
</style>
</head>
<body>
<main>
<header><span>~/kasimpati</span><span>TERMINAL</span></header>
<pre aria-label="Karakterlerle çizilen kasımpatı buketi"><code id="art" aria-hidden="true"></code></pre>
<footer><span id="status" role="status"></span><button id="replay" type="button">↻ Tekrar</button></footer>
</main>
<script>
const art = document.querySelector("#art");
const status = document.querySelector("#status");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const heads = [[11,12,9,0],[39,12,9,1],[25,8,11,2],[15,19,10,1],[35,19,10,0],[25,23,10,2]];
const colors = ["#e895c8","#ffa6ac","#ffe0a1","#75b88a","#aab8a0"];
let animation;
function draw(t) {
  const cells = Array.from({length:34}, () => Array(51).fill(null));
  const put = (x,y,char,color) => {
    if(cells[y] && x>=0 && x<51) cells[y][x] = [char,color];
  };
  heads.forEach(([x,y]) => {
    for(let row=30; row>=y; row--){
      if((30-row)*24>t) break;
      const col=Math.round(25+(x-25)*(30-row)/(30-y));
      put(col,row,x<25?"\\":x>25?"/":"|",3);
    }
  });
  if(t>280){
    ["\\             /"," \\           /","  \\         /","   \\       /","    \\     /","     \\   /","      >-<","     /   \\"].forEach((line,i)=>{
      if(t<280+i*45) return;
      [...line].forEach((ch,j)=>{if(ch!==" ") put(18+j,26+i,ch,4);});
    });
  }
  heads.forEach(([cx,cy,r,color],i) => {
    const progress=Math.max(0,Math.min(1,(t-680-i*155)/650));
    if(!progress) return;
    for(let y=cy-r;y<=cy+r;y++) for(let x=cx-r;x<=cx+r;x++){
      const dx=x-cx,dy=(y-cy)*1.38;
      const d=Math.hypot(dx,dy);
      const a=Math.atan2(dy,dx);
      const edge=r*(.90+.10*Math.cos(11*a));
      if(d>edge*progress) continue;
      const petals=["░","▒","▓","█"];
      const ridge=(Math.cos(11*a + d*.35)+1)/2;
      put(x,y,d<2?"●":petals[Math.min(3,Math.floor(ridge*3+(1-d/r)))],color);
    }
  });
  const fragment=document.createDocumentFragment();
  cells.forEach((row,index)=>{
    if(index) fragment.append("\n");
    let group=null;
    row.forEach(cell=>{
      const [ch,color]=cell || [" ",null];
      if(!group || group.color!==color){
        const span=document.createElement("span");
        if(color!==null) span.style.color=colors[color];
        fragment.append(span);
        group={span,color};
      }
      group.span.textContent+=ch;
    });
  });
  art.replaceChildren(fragment);
}
function play(){
  cancelAnimationFrame(animation);
  if(reduced.matches){draw(2200);status.textContent="> buket hazır";return;}
  status.textContent="> buket çiziliyor...";
  const start=performance.now();
  let last=-100;
  function frame(now){
    const t=now-start;
    if(t-last>=32 || t>=2200){draw(t);last=t;}
    if(t<2200) animation=requestAnimationFrame(frame);
    else status.textContent="> buket hazır";
  }
  animation=requestAnimationFrame(frame);
}
document.querySelector("#replay").addEventListener("click",play);
play();
</script>
</body>
</html>
