<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasımpatı Buketi</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#15121b;color:#f9eee6;font-family:Georgia,serif}
main{width:min(100%,650px);padding:24px 16px 32px;text-align:center}
h1{font-size:clamp(1.8rem,6cqi,3rem);margin:0;font-weight:normal}
svg{display:block;width:min(100%,520px);max-height:72svh;margin:0 auto;overflow:visible}
button{background:transparent;border:1px solid #a991ab;color:inherit;padding:10px 18px;border-radius:6px;font:inherit;cursor:pointer}
button:hover,button:focus-visible{background:#37263d}
.petal{transform:scale(0);animation:bloom .85s cubic-bezier(.22,.72,.25,1) var(--delay) both}
@keyframes bloom{to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.petal{animation:none;transform:none}}
</style>
<main>
<h1>Kasımpatı Buketi</h1>
<svg id="bouquet" viewBox="0 0 520 560" role="img" aria-label="Pembe, mürdüm ve krem kasımpatılarından oluşan bir buket">
  <g id="stems"></g>
  <path d="M255 418 107 277 208 510 282 540 405 280Z" fill="#786079"/>
  <path d="M107 277 232 399 282 540 208 510Z" fill="#4a3854"/>
  <path d="M405 280 294 413 282 540 333 490Z" fill="#a48095"/>
  <path d="M233 460Q174 423 178 467Q189 487 249 470Q290 433 315 453Q327 486 253 473L284 504M249 472 221 508" fill="none" stroke="#f0b7b4" stroke-width="8" stroke-linecap="round"/>
  <g id="flowers"></g>
</svg>
<button type="button" id="replay">Yeniden Açtır</button>
</main>
<script>
const ns = "http://www.w3.org/2000/svg";
const flowers = document.querySelector("#flowers");
const stems = document.querySelector("#stems");
const palette = [
  ["#612854","#aa548f","#dc8ab6","#efb7ce"],
  ["#ac546f","#d97e94","#f4a6ae","#ffd1bf"],
  ["#aa775b","#d1a37b","#f4d2a4","#fff0cd"]
];
const heads = [
  [156,185,65,0],[345,174,72,1],[251,123,79,2],
  [102,266,58,2],[414,259,59,0],[196,262,76,1],
  [315,251,73,0],[263,316,69,2]
];
function shape(parent, tag, attrs) {
  const el = document.createElementNS(ns, tag);
  for (const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
  parent.append(el);
  return el;
}
function draw() {
  stems.replaceChildren();
  flowers.replaceChildren();
  heads.forEach(([x,y,r,color], i) => {
    shape(stems,"path",{d:`M${x} ${y} Q${x} 320 255 472`,fill:"none",stroke:"#789373","stroke-width":4});
    const side = x < 260 ? -1 : 1;
    const lx = x + side * 30;
    const ly = Math.min(y + 100, 359);
    shape(stems,"path",{d:`M${x} ${ly+30} Q${lx} ${ly+21} ${lx+side*32} ${ly-13} Q${lx-side*12} ${ly-14} ${x} ${ly+30}Z`,fill:i%2?"#657f64":"#436553"});
    const head = shape(flowers,"g",{transform:`translate(${x} ${y})`});
    [24,21,17,13,9].forEach((count, ring) => {
      const length = r * (1 - ring*.16);
      const w = length*.15;
      for(let j=0;j<count;j++){
        const angle = j*360/count + ring*8 + i*17;
        const arm = shape(head,"g",{transform:`rotate(${angle})`});
        const petal = shape(arm,"path",{
          class:"petal", fill:palette[color][Math.min(3,ring)],
          stroke:"#422238","stroke-opacity":.28,"stroke-width":.7,
          d:`M0 5 C${-w} ${-length*.28} ${-w*1.4} ${-length*.85} ${-w*.27} ${-length} Q${w*.82} ${-length*1.08} ${w*.76} ${-length*.71} Q${w*.62} ${-length*.31} 0 5Z`
        });
        petal.style.setProperty("--delay", `${i*.17 + ring*.12 + j%5*.035}s`);
      }
    });
  });
}
document.querySelector("#replay").addEventListener("click",draw);
draw();
</script>
</html>
